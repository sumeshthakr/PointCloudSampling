<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="cube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d2ff"/>
      <stop offset="100%" style="stop-color:#3a7bd5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="200" rx="16" fill="url(#bg)"/>

  <!-- 3D Cube wireframe -->
  <g transform="translate(100, 100)" stroke="url(#cube)" stroke-width="1.5" fill="none" opacity="0.4">
    <!-- Front face -->
    <polygon points="-40,-40 40,-40 40,40 -40,40"/>
    <!-- Back face -->
    <polygon points="-20,-60 60,-60 60,20 -20,20"/>
    <!-- Connecting edges -->
    <line x1="-40" y1="-40" x2="-20" y2="-60"/>
    <line x1="40" y1="-40" x2="60" y2="-60"/>
    <line x1="40" y1="40" x2="60" y2="20"/>
    <line x1="-40" y1="40" x2="-20" y2="20"/>
  </g>

  <!-- Scattered points inside cube -->
  <g filter="url(#glow)" transform="translate(100, 100)">
    <circle cx="-15" cy="-25" r="3" fill="#00d2ff"/>
    <circle cx="10" cy="-10" r="2.5" fill="#00e5ff"/>
    <circle cx="-30" cy="5" r="2" fill="#40c4ff"/>
    <circle cx="25" cy="-30" r="3.5" fill="#00b8d4"/>
    <circle cx="5" cy="20" r="2" fill="#18ffff"/>
    <circle cx="-20" cy="-5" r="2.5" fill="#00e5ff"/>
    <circle cx="30" cy="10" r="3" fill="#00d2ff"/>
    <circle cx="-5" cy="30" r="2" fill="#40c4ff"/>
    <circle cx="20" cy="5" r="2.5" fill="#00b8d4"/>
    <circle cx="-25" cy="25" r="3" fill="#18ffff"/>
    <circle cx="15" cy="-20" r="2" fill="#00e5ff"/>
    <circle cx="-10" cy="10" r="3.5" fill="#00d2ff"/>
    <circle cx="35" cy="-15" r="2" fill="#40c4ff"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
    <circle cx="-35" cy="-20" r="2" fill="#00b8d4"/>
    <circle cx="20" cy="25" r="2.5" fill="#18ffff"/>
    <circle cx="-8" cy="-35" r="2" fill="#00e5ff"/>
    <circle cx="28" cy="-5" r="2.5" fill="#00d2ff"/>
    <circle cx="-18" cy="18" r="2" fill="#40c4ff"/>
    <circle cx="8" cy="-15" r="3" fill="#00b8d4"/>
    <!-- Outer scattered particles (fading) -->
    <circle cx="-45" cy="-10" r="1.5" fill="#00d2ff" opacity="0.3"/>
    <circle cx="50" cy="-35" r="1.5" fill="#18ffff" opacity="0.3"/>
    <circle cx="-35" cy="35" r="1" fill="#40c4ff" opacity="0.2"/>
    <circle cx="45" cy="30" r="1.5" fill="#00e5ff" opacity="0.25"/>
  </g>

  <!-- Text -->
  <text x="200" y="85" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="700" fill="#ffffff" letter-spacing="1">
    Point Cloud
  </text>
  <text x="200" y="130" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="300" fill="#00d2ff" letter-spacing="1">
    Sampling
  </text>
  <text x="200" y="160" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8892b0" letter-spacing="2">
    FAST 3D POINT GENERATION WITH NUMBA
  </text>
</svg>
